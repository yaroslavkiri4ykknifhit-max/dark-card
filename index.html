<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CENTURION | Digital Black Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full text-center space-y-8">
        <h1 class="text-4xl md:text-5xl font-light tracking-[0.3em] text-white">CENTURION</h1>
        <p class="text-gray-400 text-sm tracking-wider uppercase">Access is limited. Enter your name to mint your digital pass.</p>
        
        <form id="mintForm" class="space-y-6 mt-12">
            <div>
                <input 
                    type="text" 
                    id="nameInput" 
                    placeholder="YOUR FULL NAME" 
                    required
                    class="w-full bg-transparent border-b border-gray-600 px-4 py-3 text-center text-white focus:outline-none focus:border-white transition-colors tracking-widest placeholder-gray-600"
                >
            </div>
            
            <button 
                type="submit" 
                id="mintBtn"
                class="w-full border border-white hover:bg-white hover:text-black transition-colors duration-300 py-4 uppercase tracking-[0.2em] text-sm mt-8"
            >
                Mint Pass
            </button>
        </form>

        <p id="statusMsg" class="text-gray-500 text-xs tracking-widest mt-4 hidden"></p>
    </div>

    <script>
        const form = document.getElementById('mintForm');
        const mintBtn = document.getElementById('mintBtn');
        const statusMsg = document.getElementById('statusMsg');
        const nameInput = document.getElementById('nameInput');

        // WORKER_URL placeholder. Replace with your Cloudflare Worker URL before deployment
        const WORKER_URL = 'https://small-hill-75ca.yaroslav-kiri4ykknifhit.workers.dev/';

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = nameInput.value.trim();
            if (!name) return;

            mintBtn.disabled = true;
            mintBtn.textContent = 'Authenticating...';
            mintBtn.classList.add('opacity-50', 'cursor-not-allowed');
            statusMsg.classList.remove('hidden');
            statusMsg.textContent = 'Requesting secure access...';

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name })
                });

                if (!response.ok) {
                    throw new Error('Failed to mint pass. Please try again.');
                }
                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = 'blackcard.pkpass';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(downloadUrl);

                statusMsg.textContent = 'Access granted. Pass downloaded.';
                statusMsg.classList.add('text-green-500');
                statusMsg.classList.remove('text-gray-500');
                mintBtn.textContent = 'Pass Minted';
            } catch (error) {
                console.error(error);
                statusMsg.textContent = 'Error: ' + error.message;
                statusMsg.classList.add('text-red-500');
                statusMsg.classList.remove('text-gray-500');
                mintBtn.textContent = 'Mint Pass';
                mintBtn.disabled = false;
                mintBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
